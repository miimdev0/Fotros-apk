<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FETROS icon">
  <defs>
    <linearGradient id="g" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#F5C451"/>
      <stop offset="55%" stop-color="#FF9A2E"/>
      <stop offset="100%" stop-color="#FF7A35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#F5C451" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#FF7A35" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#101114" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>
  <!-- base rounded square -->
  <rect width="512" height="512" rx="116" fill="#101114"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- warm glow -->
  <circle cx="256" cy="268" r="210" fill="url(#glow)"/>
  <!-- top light -->
  <ellipse cx="256" cy="118" rx="190" ry="42" fill="white" opacity="0.06"/>
  <!-- SUN ARC (bold sunrise) -->
  <path d="M 84 296 A 172 172 0 0 1 428 296" fill="none" stroke="url(#g)" stroke-width="24" stroke-linecap="round" opacity="1"/>
  <!-- inner highlight on arc -->
  <path d="M 106 292 A 150 150 0 0 1 406 292" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" opacity="0.18"/>
  <!-- SUN disc -->
  <circle cx="256" cy="184" r="52" fill="url(#g)"/>
  <circle cx="256" cy="184" r="52" fill="none" stroke="white" stroke-width="1.6" opacity="0.42"/>
  <!-- sun rays (subtle) -->
  <g stroke="url(#g)" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="102" x2="256" y2="118" stroke-width="4"/>
    <line x1="202" y1="118" x2="212" y2="130" stroke-width="3.5"/>
    <line x1="310" y1="118" x2="300" y2="130" stroke-width="3.5"/>
    <line x1="168" y1="150" x2="182" y2="158" stroke-width="3"/>
    <line x1="344" y1="150" x2="330" y2="158" stroke-width="3"/>
  </g>
  <!-- CRESCENT (stylized, elegant) -->
  <path d="M 256 238 C 286 238 312 258 318 286 C 304 278 288 274 271 275 C 236 276.5 210 304 212 338 C 213.5 354 221 368 232 378 C 188 370 158 326 168 280 C 172 258 184 242 202 232 C 218 238 237 238 256 238 Z" fill="#FFF8EA" opacity="0.98"/>
  <path d="M 256 242 C 277 242 295 252 305 268 C 298 265 290 263 281 263 C 252 264 229 287 230 316 C 230.5 324 232.5 331 236 337 C 203 327 182 294 188 260 C 191 250 197 241 205 234 C 221 239 238 242 256 242 Z" fill="white" opacity="0.0"/>
  <!-- horizon calendar grid -->
  <g opacity="1">
    <rect x="112" y="378" width="288" height="48" rx="14" fill="rgba(255,248,234,0.10)" stroke="rgba(255,255,255,0.17)" stroke-width="1.4"/>
    <line x1="118" y1="394" x2="394" y2="394" stroke="rgba(255,255,255,0.16)" stroke-width="1.2"/>
    
    <line x1="155" y1="382" x2="155" y2="422" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <line x1="205" y1="382" x2="205" y2="422" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <line x1="256" y1="382" x2="256" y2="422" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <line x1="307" y1="382" x2="307" y2="422" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <line x1="357" y1="382" x2="357" y2="422" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <!-- active day dot -->
    <circle cx="256" cy="410" r="7.4" fill="url(#g)"/>
  </g>
  <!-- subtle bottom reflection -->
  <ellipse cx="256" cy="432" rx="120" ry="10" fill="white" opacity="0.04"/>
</svg>
