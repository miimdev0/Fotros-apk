name: Build FETROS Android APK (free cloud build)

# این فایل یک راه‌اندازی ابری رایگان برای ساخت APK است.
# - روی ریپوی PUBLIC، دقیقه‌های GitHub Actions نامحدود و رایگان است.
# - روی ریپوی PRIVATE، ماهی ۲۰۰۰ دقیقه رایگان (پلن Free).
# دو روش ساخته می‌شود:
#   1) TWA با bubblewrap (روش اصلی، بدون Android Studio) → app-debug.apk
#   2) Capacitor (اختیاری، برای افزونه‌های بومی در آینده)
# برای اجرا: تب Actions → «Build FETROS Android APK» → Run workflow

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "آدرس کامل وب‌اپ (مثلاً https://USERNAME.github.io/Fotros-apk/)"
        required: true
        default: "https://USERNAME.github.io/Fotros-apk/"
      app_name:
        description: "نام برنامه"
        required: false
        default: "فطرس"
      package_id:
        description: "شناسهٔ بسته (معکوس دامنه)"
        required: false
        default: "ir.fetros.app"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: fetros-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK (TWA via Bubblewrap)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_URL: ${{ github.event.inputs.site_url || 'https://USERNAME.github.io/Fotros-apk/' }}
      APP_NAME: ${{ github.event.inputs.app_name || 'فطرس' }}
      PACKAGE_ID: ${{ github.event.inputs.package_id || 'ir.fetros.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK sanity (preinstalled on ubuntu-latest)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" | head -20 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@latest

      - name: Generate TWA project from the live manifest
        run: |
          mkdir -p twa && cd twa
          bubblewrap --update
          bubblewrap init \
            --manifest "$SITE_URL/manifest.json" \
            --app-name "$APP_NAME" \
            --package-id "$PACKAGE_ID" \
            --host-name "$(echo "$SITE_URL" | sed -E 's#https?://([^/]+).*#\1#')"
          ls -la

      - name: Build debug APK (gradle, default debug keystore)
        working-directory: twa
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug || ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp twa/app/build/outputs/apk/debug/app-debug.apk out/fetros-debug.apk || \
          find . -name "*.apk" -exec cp {} out/fetros-debug.apk \;
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fetros-android-apk
          path: out/fetros-debug.apk
          if-no-files-found: error
          retention-days: 30

  # ── روش دوم (اختیاری): Capacitor ───────────────────────────────────────────
  # برای وقتی که اعلان مطمئنِ پس‌زمینه/ویجت لازم می‌شود.
  # با پیش‌فرض خاموش است؛ برای فعال‌کردن، خط «if: false» را پاک کنید.
  capacitor:
    if: false
    name: Optional Capacitor project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Stage web assets into www/
        run: |
          mkdir -p www
          cp index.html style.css script.js manifest.json sw.js offline.html README.md www/
          cp -r fonts icons data audio www/
      - name: Add Capacitor + Android platform
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fetros-capacitor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
